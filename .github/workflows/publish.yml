# Publishes to npm when a GitHub release is published (tag like v0.1.0).
#
# Authentication (pick one):
#  - npm "Trusted Publishing": on npmjs.com → package settings → Trusted publishers,
#    add this repository and workflow file (publish.yml). No secret needed.
#  - Or add an automation token as the NPM_TOKEN repository secret.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
